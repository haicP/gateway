services:
  llmgateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    image: llmgateway:llm-route-test
    container_name: llmgateway-running
    environment:
      ONGOINGAI_HOST: 0.0.0.0
      ONGOINGAI_PORT: ${ONGOINGAI_CONTAINER_PORT:-8080}
    ports:
      - "${ONGOINGAI_HTTP_PORT:-18080}:${ONGOINGAI_CONTAINER_PORT:-8080}"
    volumes:
      - ./ongoingai.yaml:/app/ongoingai.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
