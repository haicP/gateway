# 轻量级转发记录网关配置。
server:
  host: 0.0.0.0
  port: 8070

# 请求记录存储。SQLite 适合单机，Postgres 适合多实例共享记录。
storage:
  driver: postgres
  # path: ./data/ongoingai.db
  dsn: postgres://root:password@localhost:5432/ongoingai?sslmode=disable

# 上游服务路由：匹配 prefix 后剥离该前缀并透传到 upstream。
providers:
  myllm:
    upstream: http://192.168.68.55:3000
    prefix: /llmgateway

# 请求/响应详情记录。
tracing:
  capture_bodies: true
  # 0 表示不限制内存前缀；超大请求仍会走临时文件 spool。
  body_max_size: 0
  retention:
    days: 14
    cleanup_enabled: false
    cleanup_daily_at: "02:00"
    cleanup_timezone: Local

# 面板入口。多实例部署时建议只在一个实例开启。
dashboard:
  enabled: true

# 结构化运行日志。Docker 内默认写入 /app/data/logs。
logging:
  dir: ./data/logs
  stdout: false

# 请求详情备份。开启后按日导出 trace/request/response 详情到 S3 兼容对象存储。
backup:
  request_details:
    enabled: false
    timezone: Asia/Shanghai
    daily_at: "02:00"
    temp_dir: ./data/backup-tmp
    page_size: 500
    shard_max_bytes: 209715200
    retry:
      max_attempts: 5
      initial_backoff_ms: 1000
      max_backoff_ms: 30000
    s3:
      bucket: "llmgateway"
      prefix: request-details
      region: "haic"
      endpoint: "http://192.168.68.99:9000"
      force_path_style: true
