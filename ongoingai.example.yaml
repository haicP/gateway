# Lightweight proxy recorder configuration.
server:
  host: 0.0.0.0
  port: 8080

# Request detail storage. Use sqlite for a single self-hosted process, or
# postgres when multiple gateway instances should share one trace store.
storage:
  driver: sqlite
  path: ./data/ongoingai.db
  # dsn: postgres://user:password@localhost:5432/ongoingai?sslmode=disable

# Provider routes. The gateway strips prefix before forwarding to upstream.
providers:
  llm:
    upstream: https://api.openai.com
    prefix: /llm

# Request and response detail capture.
tracing:
  # When false, headers/status/timing/token metadata are still recorded.
  capture_bodies: false
  # Maximum captured bytes per request body and response body.
  body_max_size: 1048576
  retention:
    days: 14
    cleanup_enabled: false
    cleanup_daily_at: "02:00"
    cleanup_timezone: Local

# Lightweight local dashboard. In multi-instance deployments, enable this on
# only one instance or expose it behind a dedicated authenticated route.
dashboard:
  enabled: false

# Optional request detail backup to S3-compatible object storage.
backup:
  request_details:
    enabled: false
    timezone: Local
    daily_at: "02:00"
    temp_dir: ./data/backup-tmp
    page_size: 500
    shard_max_bytes: 209715200
    retry:
      max_attempts: 5
      initial_backoff_ms: 1000
      max_backoff_ms: 30000
    s3:
      bucket: ""
      prefix: request-details
      region: ""
      endpoint: ""
      force_path_style: false
