<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --bg-accent: rgba(13, 148, 136, 0.08);
      --panel: rgba(255, 255, 255, 0.94);
      --panel-strong: #ffffff;
      --panel-soft: #f8fafc;
      --line: #e2e8f0;
      --line-strong: #cbd5e1;
      --muted: #64748b;
      --text: #0f172a;
      --text-soft: #334155;
      --teal: #0f766e;
      --teal-strong: #0d9488;
      --teal-soft: #ccfbf1;
      --teal-ring: rgba(13, 148, 136, 0.18);
      --blue-soft: #dbeafe;
      --blue: #1d4ed8;
      --green: #047857;
      --green-soft: #dcfce7;
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --gray-soft: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 4px 10px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.07), 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.16), 0 8px 24px rgba(15, 23, 42, 0.08);
      --overlay: rgba(15, 23, 42, 0.38);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    [hidden] {
      display: none !important;
    }

    html {
      background:
        radial-gradient(circle at top left, var(--bg-accent), transparent 28%),
        linear-gradient(180deg, #fbfdff 0%, var(--bg) 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    button, input, select {
      font: inherit;
    }

    button, input, select, pre {
      transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .page {
      width: min(1600px, 100%);
      height: 100vh;
      margin: 0 auto;
      padding: 0 28px 92px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(14px);
    }

    .filters {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 22px;
      display: grid;
      gap: 18px;
      flex: 0 0 auto;
      border-radius: 18px;
    }

    .filter-fields {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .field-wide {
      grid-column: span 2;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-soft);
    }

    input, select, button {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-strong);
      color: var(--text);
      padding: 0 14px;
      outline: none;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus, select:focus {
      border-color: var(--teal-strong);
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 5px var(--teal-ring);
    }

    .filters-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(148, 163, 184, 0), rgba(148, 163, 184, 0.55), rgba(148, 163, 184, 0));
    }

    .filter-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .filter-hint {
      color: var(--muted);
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
      white-space: nowrap;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .ghost {
      background: rgba(248, 250, 252, 0.84);
      border-color: var(--line);
      color: var(--text-soft);
    }

    .ghost:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: var(--line-strong);
    }

    .primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--teal), var(--teal-strong));
      color: #fff;
      box-shadow: 0 10px 20px rgba(13, 148, 136, 0.22);
    }

    .primary:hover:not(:disabled) {
      box-shadow: 0 12px 24px rgba(13, 148, 136, 0.26);
    }

    .table-shell {
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 22px;
      overflow: visible;
      backdrop-filter: none;
    }

    .table-scroll {
      height: 100%;
      min-height: 0;
      margin-top: 0;
      overflow: auto;
      border-radius: 18px 18px 0 0;
    }

    table {
      width: 100%;
      min-width: 1320px;
      border-collapse: separate;
      border-spacing: 0;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.92);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(248, 250, 252, 0.92);
      backdrop-filter: blur(12px);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tbody tr {
      background: transparent;
      transition: background-color 160ms ease;
    }

    tbody tr:hover {
      background: rgba(241, 245, 249, 0.78);
    }

    td {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    td strong,
    .strong {
      color: var(--text);
      font-weight: 700;
    }

    .cell-time,
    .cell-metric,
    .cell-tokens {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .cell-status,
    .cell-action {
      white-space: nowrap;
    }

    .user-agent {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.01em;
      border: 1px solid transparent;
    }

    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.12);
    }

    .status-badge.ok {
      color: var(--green);
      background: var(--green-soft);
      border-color: rgba(4, 120, 87, 0.14);
    }

    .status-badge.ok::before {
      box-shadow: 0 0 0 4px rgba(4, 120, 87, 0.12);
    }

    .status-badge.bad {
      color: var(--red);
      background: var(--red-soft);
      border-color: rgba(185, 28, 28, 0.14);
    }

    .status-badge.bad::before {
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.12);
    }

    .status-badge.neutral {
      color: var(--text-soft);
      background: #f1f5f9;
      border-color: rgba(148, 163, 184, 0.18);
    }

    .tokens {
      display: grid;
      gap: 4px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .token-main {
      font-weight: 700;
    }

    .token-sub {
      color: var(--muted);
      font-size: 12px;
    }

    .link-button {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border-color: rgba(148, 163, 184, 0.28);
      background: rgba(248, 250, 252, 0.92);
      box-shadow: none;
      color: var(--text-soft);
    }

    .link-button:hover:not(:disabled) {
      background: #eef2ff;
      border-color: rgba(99, 102, 241, 0.16);
      color: var(--blue);
    }

    .footer {
      position: fixed;
      left: 50%;
      width: min(calc(100% - 56px), 1544px);
      bottom: 0;
      z-index: 9;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 0;
      padding: 16px 22px 18px;
      background: rgba(255, 255, 255, 0.92);
      border-top: 1px solid rgba(226, 232, 240, 0.88);
      border-radius: 0 0 18px 18px;
      box-shadow: 0 -10px 28px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(14px);
    }

    .summary-block {
      display: grid;
      gap: 4px;
      min-width: 180px;
    }

    .summary-total {
      color: var(--text);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .pager {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pager button {
      min-width: 44px;
      padding: 0 12px;
    }

    .page-jump {
      width: 72px;
      padding: 0 10px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .page-total {
      min-width: 56px;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .muted {
      color: var(--muted);
    }

    .empty {
      padding: 52px 24px;
      text-align: center;
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--overlay);
      backdrop-filter: blur(4px);
    }

    .modal {
      width: min(980px, 100%);
      max-height: min(780px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto 1fr;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modal-in 180ms ease;
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.9);
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.94), rgba(255, 255, 255, 0.94));
    }

    .modal-title {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .modal-title strong {
      color: var(--text);
      font-size: 18px;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.92);
      color: var(--text-soft);
      box-shadow: none;
    }

    .icon-button:hover:not(:disabled) {
      background: #f1f5f9;
      color: var(--text);
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
    }

    .modal-body {
      overflow: auto;
      padding: 20px 22px 24px;
      display: grid;
      gap: 18px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .detail-box {
      display: grid;
      gap: 6px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.98), rgba(241, 245, 249, 0.92));
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 14px;
      min-width: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .detail-box span {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .detail-box strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .body-block {
      display: grid;
      gap: 10px;
    }

    pre {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      padding: 16px;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    @media (max-width: 1280px) {
      .filter-fields {
        grid-template-columns: repeat(3, minmax(180px, 1fr));
      }

      .field-wide {
        grid-column: span 1;
      }
    }

    @media (max-width: 900px) {
      .page {
        padding: 0 20px 128px;
      }

      .footer {
        width: calc(100% - 40px);
      }

      .filter-actions,
      .footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .filter-fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .actions {
        justify-content: flex-start;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 0 14px 156px;
      }

      .footer {
        width: calc(100% - 28px);
      }

      .filters,
      .footer,
      .modal-header,
      .modal-body {
        padding-left: 16px;
        padding-right: 16px;
      }

      .filter-fields {
        grid-template-columns: 1fr;
      }

      .actions,
      .pager {
        width: 100%;
      }

      .actions button,
      .pager button,
      .pager select {
        flex: 1 1 auto;
      }

      .modal {
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="filters panel" aria-label="Trace filters">
      <div class="filter-fields">
        <div class="field">
          <label for="apiKey">API 密钥</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="输入明文后本地 hash">
        </div>
        <div class="field">
          <label for="range">时间范围</label>
          <select id="range">
            <option value="7d">近 7 天</option>
            <option value="1d">近 1 天</option>
            <option value="30d">近 30 天</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="field">
          <label for="prefix">Prefix</label>
          <select id="prefix">
            <option value="">全部 prefix</option>
          </select>
        </div>
        <div class="field">
          <label for="model">模型</label>
          <input id="model" list="modelOptions" placeholder="全部模型">
          <datalist id="modelOptions"></datalist>
        </div>
        <div class="field">
          <label for="endpoint">端点</label>
          <input id="endpoint" placeholder="/v1/responses">
        </div>
        <div class="field">
          <label for="status">状态</label>
          <input id="status" inputmode="numeric" pattern="[0-9]*" placeholder="全部状态">
        </div>
        <div class="field custom-time" hidden>
          <label for="from">开始时间</label>
          <input id="from" type="datetime-local">
        </div>
        <div class="field custom-time" hidden>
          <label for="to">结束时间</label>
          <input id="to" type="datetime-local">
        </div>
      </div>
      <div class="filters-divider"></div>
      <div class="filter-actions">
        <div class="filter-hint">所有筛选仅影响当前视图；导出 CSV 只包含当前页已加载结果。</div>
        <div class="actions">
          <button id="refresh" class="ghost" type="button">刷新</button>
          <button id="reset" class="ghost" type="button">重置</button>
          <button id="exportCsv" class="primary" type="button">导出 CSV</button>
        </div>
      </div>
    </section>

    <section class="table-shell panel" aria-label="Trace table">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>Provider</th>
              <th>模型</th>
              <th>端点</th>
              <th>状态</th>
              <th>Token</th>
              <th>首 Token</th>
              <th>耗时</th>
              <th>User-Agent</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>暂无结果</div>
      </div>

      <footer class="footer">
        <div class="summary-block">
          <div id="summary" class="muted">显示 0 条结果</div>
          <div id="totalSummary" class="summary-total">共 0 条匹配结果</div>
        </div>
        <div class="pager">
          <label for="limit" class="muted">每页</label>
          <select id="limit">
            <option>25</option>
            <option selected>50</option>
            <option>100</option>
            <option>200</option>
          </select>
          <span id="pageTotal" class="page-total">共 0 页</span>
          <label for="pageJump" class="muted">跳至</label>
          <input id="pageJump" class="page-jump" type="number" min="1" value="1" inputmode="numeric">
          <button id="jumpPage" class="ghost" type="button">跳转</button>
          <button id="prev" class="ghost" type="button">上一页</button>
          <button id="next" class="ghost" type="button">下一页</button>
        </div>
      </footer>
    </section>
  </main>

  <div id="detailModal" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <header class="modal-header">
        <div class="modal-title">
          <strong id="detailTitle">请求详情</strong>
          <span id="detailSubTitle" class="muted"></span>
        </div>
        <button id="closeDetail" class="icon-button" type="button" aria-label="关闭详情">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </header>
      <div class="modal-body">
        <div class="detail-grid">
          <div class="detail-box"><span>Provider</span><strong id="detailProvider">-</strong></div>
          <div class="detail-box"><span>Prefix</span><strong id="detailPrefix">-</strong></div>
          <div class="detail-box"><span>模型</span><strong id="detailModel">-</strong></div>
          <div class="detail-box"><span>端点</span><strong id="detailEndpoint">-</strong></div>
          <div class="detail-box"><span>状态</span><strong id="detailStatus">-</strong></div>
        </div>
        <div class="body-block">
          <label>请求 Body</label>
          <pre id="detailRequest">-</pre>
        </div>
        <div class="body-block">
          <label>回复文本</label>
          <pre id="detailResponse">-</pre>
        </div>
      </div>
    </section>
  </div>

  <script>
    const providerPrefixes = __PROVIDER_PREFIXES__;
    const state = {
      items: [],
      cursorStack: [''],
      pageIndex: 0,
      nextCursor: '',
      totalCount: 0,
      loading: false,
    };

    const $ = (id) => document.getElementById(id);
    const rows = $('rows');
    const empty = $('empty');
    const customTimeFields = Array.from(document.querySelectorAll('.custom-time'));

    populateProviderPrefixes();

    $('range').addEventListener('change', () => {
      const custom = $('range').value === 'custom';
      customTimeFields.forEach((node) => { node.hidden = !custom; });
    });
    $('refresh').addEventListener('click', () => loadFirstPage());
    $('reset').addEventListener('click', resetFilters);
    $('exportCsv').addEventListener('click', exportCSV);
    $('closeDetail').addEventListener('click', closeDetail);
    $('detailModal').addEventListener('click', (event) => {
      if (event.target === $('detailModal')) closeDetail();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeDetail();
    });
    $('prev').addEventListener('click', () => loadPage(state.pageIndex - 1));
    $('next').addEventListener('click', () => loadPage(state.pageIndex + 1));
    $('jumpPage').addEventListener('click', jumpToPage);
    $('pageJump').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') jumpToPage();
    });
    $('limit').addEventListener('change', () => loadFirstPage());

    function resetFilters() {
      $('apiKey').value = '';
      $('range').value = '7d';
      $('prefix').value = '';
      $('model').value = '';
      $('endpoint').value = '';
      $('status').value = '';
      $('from').value = '';
      $('to').value = '';
      customTimeFields.forEach((node) => { node.hidden = true; });
      loadFirstPage();
    }

    async function loadFirstPage() {
      state.cursorStack = [''];
      await loadPage(0);
    }

    async function loadPage(index) {
      if (index < 0 || state.loading) return;
      if (index === state.pageIndex + 1 && !state.cursorStack[index] && state.nextCursor) {
        state.cursorStack[index] = state.nextCursor;
      }
      if (index > 0 && !state.cursorStack[index]) return;
      state.loading = true;
      setButtons();
      try {
        const payload = await fetchTracePage(index);
        applyTracePage(payload, index);
        render();
      } catch (err) {
        renderLoadError(err);
      } finally {
        state.loading = false;
        setButtons();
      }
    }

    async function jumpToPage() {
      if (state.loading) return;
      const totalPages = pageCount();
      if (totalPages <= 0) return;
      const requested = Number($('pageJump').value);
      if (!Number.isFinite(requested)) return;
      const targetIndex = Math.min(Math.max(Math.trunc(requested), 1), totalPages) - 1;
      state.loading = true;
      setButtons();
      try {
        await ensureCursorForPage(targetIndex);
        const payload = await fetchTracePage(targetIndex);
        applyTracePage(payload, targetIndex);
        render();
      } catch (err) {
        renderLoadError(err);
      } finally {
        state.loading = false;
        setButtons();
      }
    }

    async function ensureCursorForPage(targetIndex) {
      if (targetIndex <= 0 || state.cursorStack[targetIndex]) return;
      if (targetIndex === state.pageIndex + 1 && state.nextCursor) {
        state.cursorStack[targetIndex] = state.nextCursor;
        return;
      }

      let startIndex = 0;
      for (let index = 0; index < targetIndex; index += 1) {
        if (state.cursorStack[index] !== undefined) startIndex = index;
      }

      for (let index = startIndex; index < targetIndex; index += 1) {
        if (index === state.pageIndex && state.nextCursor) {
          state.cursorStack[index + 1] = state.nextCursor;
          continue;
        }
        const payload = await fetchTracePage(index);
        const nextCursor = payload.next_cursor || '';
        if (!nextCursor) throw new Error('目标页超出当前查询结果');
        state.cursorStack[index + 1] = nextCursor;
      }
    }

    async function fetchTracePage(index) {
      const params = await buildParams();
      const cursor = state.cursorStack[index] || '';
      if (cursor) params.set('cursor', cursor);
      const res = await fetch('/api/traces?' + params.toString(), {
        headers: { 'Accept': 'application/json' },
      });
      if (!res.ok) throw new Error(await errorMessage(res));
      return res.json();
    }

    function applyTracePage(payload, index) {
      state.items = Array.isArray(payload.items) ? payload.items : [];
      state.nextCursor = payload.next_cursor || '';
      state.totalCount = Number(payload.total_count || 0);
      state.pageIndex = index;
      if (state.nextCursor) state.cursorStack[index + 1] = state.nextCursor;
    }

    function renderLoadError(err) {
      state.items = [];
      state.nextCursor = '';
      state.totalCount = 0;
      rows.innerHTML = '';
      empty.hidden = false;
      empty.textContent = err.message || '加载失败';
      $('summary').textContent = '加载失败';
      $('totalSummary').textContent = '共 0 条匹配结果';
      $('pageTotal').textContent = '共 0 页';
    }

    async function buildParams() {
      const params = new URLSearchParams();
      params.set('limit', $('limit').value);
      const model = $('model').value.trim();
      const prefix = $('prefix').value.trim();
      const endpoint = $('endpoint').value.trim();
      const status = $('status').value.trim();
      if (model) params.set('model', model);
      if (prefix) params.set('prefix', prefix);
      if (endpoint) params.set('endpoint', endpoint);
      if (status) params.set('status', status);
      const key = $('apiKey').value.trim();
      if (key) params.set('api_key_hash', await sha256Hex(key));

      const range = $('range').value;
      const now = new Date();
      if (range === 'custom') {
        if ($('from').value) params.set('from', new Date($('from').value).toISOString());
        if ($('to').value) params.set('to', new Date($('to').value).toISOString());
      } else {
        const days = range === '1d' ? 1 : range === '30d' ? 30 : 7;
        params.set('from', new Date(now.getTime() - days * 24 * 60 * 60 * 1000).toISOString());
        params.set('to', now.toISOString());
      }
      return params;
    }

    async function sha256Hex(value) {
      const data = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    async function errorMessage(res) {
      try {
        const payload = await res.json();
        return payload.error || res.statusText;
      } catch (_) {
        return res.statusText;
      }
    }

    function render() {
      rows.innerHTML = '';
      const models = new Set();
      for (const item of state.items) {
        if (item.model) models.add(item.model);
        const tr = document.createElement('tr');
        tr.innerHTML = [
          td(formatDate(item.created_at || item.timestamp), 'cell-time'),
          td(providerHTML(item)),
          td(escapeHTML(item.model || 'unknown'), 'strong'),
          td(escapeHTML(item.endpoint || item.request_path || '/')),
          td(statusHTML(item.response_status), 'cell-status'),
          td(tokenHTML(item), 'cell-tokens'),
          td(formatSeconds(item.time_to_first_token_ms), 'cell-metric'),
          td(formatSeconds(item.latency_ms), 'cell-metric'),
          td(`<span class="user-agent">${escapeHTML(item.user_agent || '-')}</span>`),
          td(`<button type="button" class="link-button" data-trace-id="${escapeHTML(item.id || '')}">详情</button>`, 'cell-action'),
        ].join('');
        rows.appendChild(tr);
      }
      rows.querySelectorAll('[data-trace-id]').forEach((button) => {
        button.addEventListener('click', () => openDetail(button.dataset.traceId));
      });
      syncModelOptions(models);
      empty.hidden = state.items.length !== 0;
      empty.textContent = '暂无结果';
      const start = state.items.length === 0 ? 0 : state.pageIndex * Number($('limit').value) + 1;
      const end = start + state.items.length - 1;
      $('summary').textContent = state.items.length ? `显示 ${start} 至 ${end} 条结果` : '显示 0 条结果';
      $('totalSummary').textContent = `共 ${formatNumber(state.totalCount)} 条匹配结果`;
      $('pageTotal').textContent = `共 ${formatNumber(pageCount())} 页`;
      $('pageJump').max = String(Math.max(pageCount(), 1));
      $('pageJump').value = String(state.pageIndex + 1);
    }

    function td(content, className = '') {
      return `<td${className ? ` class="${className}"` : ''}>${content}</td>`;
    }

    function statusHTML(status) {
      if (!status) return '<span class="status-badge neutral">-</span>';
      const cls = status >= 200 && status < 400 ? 'ok' : 'bad';
      return `<span class="status-badge ${cls}">${escapeHTML(String(status))}</span>`;
    }

    function tokenHTML(item) {
      const input = Number(item.input_tokens || 0).toLocaleString();
      const output = Number(item.output_tokens || 0).toLocaleString();
      const total = Number(item.total_tokens || 0).toLocaleString();
      return `<div class="tokens"><div class="token-main">↓ ${input} &nbsp; ↑ ${output}</div><div class="token-sub">总 ${total}</div></div>`;
    }

    function providerHTML(item) {
      const provider = item.provider || 'unknown';
      const prefix = item.provider_prefix || '-';
      return `<div class="tokens"><div class="token-main">${escapeHTML(provider)}</div><div class="token-sub">${escapeHTML(prefix)}</div></div>`;
    }

    function formatSeconds(ms) {
      const value = Number(ms || 0);
      if (!value) return '-';
      return (value / 1000).toFixed(2) + 's';
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[ch]));
    }

    function syncModelOptions(models) {
      const datalist = $('modelOptions');
      const existing = new Set(Array.from(datalist.children).map((node) => node.value));
      for (const model of models) {
        if (existing.has(model)) continue;
        const option = document.createElement('option');
        option.value = model;
        datalist.appendChild(option);
      }
    }

    function populateProviderPrefixes() {
      const select = $('prefix');
      const existing = new Set(Array.from(select.options).map((option) => option.value));
      for (const prefix of providerPrefixes) {
        if (!prefix || existing.has(prefix)) continue;
        const option = document.createElement('option');
        option.value = prefix;
        option.textContent = prefix;
        select.appendChild(option);
        existing.add(prefix);
      }
    }

    function setButtons() {
      $('prev').disabled = state.loading || state.pageIndex === 0;
      $('next').disabled = state.loading || !state.nextCursor;
      $('refresh').disabled = state.loading;
      $('jumpPage').disabled = state.loading || pageCount() <= 1;
      $('pageJump').disabled = state.loading || pageCount() <= 1;
    }

    function pageCount() {
      const limit = Number($('limit').value || 50);
      if (!limit || state.totalCount <= 0) return 0;
      return Math.ceil(state.totalCount / limit);
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString();
    }

    async function openDetail(id) {
      if (!id) return;
      $('detailModal').hidden = false;
      $('detailTitle').textContent = '请求详情';
      $('detailSubTitle').textContent = id;
      $('detailProvider').textContent = '-';
      $('detailPrefix').textContent = '-';
      $('detailModel').textContent = '-';
      $('detailEndpoint').textContent = '-';
      $('detailStatus').textContent = '-';
      $('detailRequest').textContent = '加载中...';
      $('detailResponse').textContent = '加载中...';

      try {
        const res = await fetch('/api/traces/' + encodeURIComponent(id), {
          headers: { 'Accept': 'application/json' },
        });
        if (!res.ok) throw new Error(await errorMessage(res));
        const detail = await res.json();
        $('detailProvider').textContent = detail.provider || 'unknown';
        $('detailPrefix').textContent = detail.provider_prefix || '-';
        $('detailModel').textContent = detail.model || 'unknown';
        $('detailEndpoint').textContent = detail.endpoint || detail.request_path || '/';
        $('detailStatus').textContent = String(detail.response_status || '-');
        $('detailSubTitle').textContent = formatDate(detail.created_at || detail.timestamp);
        $('detailRequest').textContent = summarizeText(detail.request_body);
        $('detailResponse').textContent = summarizeText(responseText(detail));
      } catch (err) {
        $('detailRequest').textContent = '-';
        $('detailResponse').textContent = err.message || '加载失败';
      }
    }

    function closeDetail() {
      $('detailModal').hidden = true;
    }

    function responseText(detail) {
      if (detail.llm_response_content) return stringifyValue(detail.llm_response_content);
      if (detail.response_body) return detail.response_body;
      return '';
    }

    function summarizeText(value) {
      const text = stringifyValue(value).trim();
      if (!text) return '-';
      const limit = 4000;
      if (text.length <= limit) return text;
      return text.slice(0, limit) + `\n\n... 已截断，原始长度 ${text.length} 字符`;
    }

    function stringifyValue(value) {
      if (value == null) return '';
      if (typeof value === 'string') return value;
      return JSON.stringify(value, null, 2);
    }

    function exportCSV() {
      const headers = ['created_at', 'provider', 'provider_prefix', 'model', 'endpoint', 'status', 'input_tokens', 'output_tokens', 'total_tokens', 'ttft_ms', 'latency_ms', 'user_agent'];
      const lines = [headers.join(',')];
      for (const item of state.items) {
        lines.push([
          item.created_at || item.timestamp || '',
          item.provider || '',
          item.provider_prefix || '',
          item.model || '',
          item.endpoint || item.request_path || '',
          item.response_status || '',
          item.input_tokens || 0,
          item.output_tokens || 0,
          item.total_tokens || 0,
          item.time_to_first_token_ms || 0,
          item.latency_ms || 0,
          item.user_agent || '',
        ].map(csvCell).join(','));
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'traces.csv';
      link.click();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      const text = String(value);
      if (!/[",\n]/.test(text)) return text;
      return '"' + text.replaceAll('"', '""') + '"';
    }

    loadFirstPage();
  </script>
</body>
</html>
