openapi: 3.0.3
info:
  title: OngoingAI Gateway API
  version: 0.1.0
  description: |
    Lightweight proxy recorder API. Provider proxy routes, such as `/llm/*`,
    are pass-through routes configured in YAML and are intentionally not fully
    modeled here.
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      summary: Root service metadata
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootStatus'
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/traces:
    get:
      summary: List recorded requests
      parameters:
        - $ref: '#/components/parameters/TraceGroupID'
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/RunID'
        - in: query
          name: provider
          schema:
            type: string
        - in: query
          name: model
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: integer
            minimum: 100
            maximum: 599
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            maximum: 200
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Trace page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /api/traces/{id}:
    get:
      summary: Get recorded request detail
      parameters:
        - $ref: '#/components/parameters/TraceID'
      responses:
        '200':
          description: Trace detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /api/traces/{id}/replay:
    get:
      summary: Replay trace checkpoints
      parameters:
        - $ref: '#/components/parameters/TraceID'
        - $ref: '#/components/parameters/CheckpointID'
        - $ref: '#/components/parameters/ThreadID'
        - $ref: '#/components/parameters/RunID'
        - $ref: '#/components/parameters/ReplayLimit'
      responses:
        '200':
          description: Replay checkpoint history and target state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceReplayResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /api/traces/{id}/fork:
    post:
      summary: Create fork lineage headers
      parameters:
        - $ref: '#/components/parameters/TraceID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceForkRequest'
      responses:
        '200':
          description: Fork lineage headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceForkResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    TraceID:
      in: path
      name: id
      required: true
      schema:
        type: string
    TraceGroupID:
      in: query
      name: trace_group_id
      schema:
        type: string
    ThreadID:
      in: query
      name: thread_id
      schema:
        type: string
    RunID:
      in: query
      name: run_id
      schema:
        type: string
    CheckpointID:
      in: query
      name: checkpoint_id
      schema:
        type: string
    ReplayLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RootStatus:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        uptime_sec:
          type: integer
        storage_driver:
          type: string
        storage_path:
          type: string
        trace_count:
          type: integer
        db_size_bytes:
          type: integer
    TracesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummary'
        next_cursor:
          type: string
    TraceSummary:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        provider:
          type: string
        model:
          type: string
        request_method:
          type: string
        request_path:
          type: string
        response_status:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        total_tokens:
          type: integer
        latency_ms:
          type: integer
        time_to_first_token_ms:
          type: integer
        time_to_first_token_us:
          type: integer
        api_key_hash:
          type: string
        estimated_cost_usd:
          type: number
        created_at:
          type: string
          format: date-time
    TraceDetail:
      allOf:
        - $ref: '#/components/schemas/TraceSummary'
        - type: object
          properties:
            trace_group_id:
              type: string
            lineage:
              $ref: '#/components/schemas/TraceLineage'
            request_headers:
              type: object
              additionalProperties: true
            request_body:
              type: string
            response_headers:
              type: object
              additionalProperties: true
            response_body:
              type: string
            llm_request_prompt:
              type: string
            llm_response_content:
              nullable: true
            metadata:
              type: object
              additionalProperties: true
    TraceLineage:
      type: object
      properties:
        group_id:
          type: string
        thread_id:
          type: string
        run_id:
          type: string
        checkpoint_id:
          type: string
        parent_checkpoint_id:
          type: string
        checkpoint_seq:
          type: integer
        immutable:
          type: boolean
    TraceReplayResponse:
      type: object
      properties:
        source_trace_id:
          type: string
        target_checkpoint_id:
          type: string
        lineage:
          $ref: '#/components/schemas/TraceLineage'
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummary'
        truncated:
          type: boolean
        target_trace:
          $ref: '#/components/schemas/TraceDetail'
    TraceForkRequest:
      type: object
      properties:
        checkpoint_id:
          type: string
        thread_id:
          type: string
        run_id:
          type: string
    TraceForkResponse:
      type: object
      properties:
        fork_id:
          type: string
        source_trace_id:
          type: string
        source_checkpoint_id:
          type: string
        lineage:
          type: object
          additionalProperties: true
        headers:
          type: object
          additionalProperties:
            type: string
    Error:
      type: object
      properties:
        error:
          type: string
